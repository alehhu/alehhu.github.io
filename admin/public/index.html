<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Alessandro Hu</title>
<link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Blog editor</h1>
    <button id="btn-new-post" type="button">+ New post</button>
    <button id="btn-new-project" type="button">+ New project</button>
  </header>

  <section id="view-list">
    <div id="list-error" class="error" hidden></div>
    <h2>Pages</h2>
    <div id="pages-list" class="items"></div>
    <h2>Posts</h2>
    <div id="posts-list" class="items"></div>
    <h2>Projects</h2>
    <div id="portfolio-list" class="items"></div>
  </section>

  <section id="view-editor" hidden>
    <div class="editor-toolbar">
      <button id="btn-back" type="button">&larr; Back to list</button>
      <span id="editor-status" class="status"></span>
      <span class="spacer"></span>
      <button id="btn-toggle-draft" type="button" hidden></button>
      <button id="btn-delete" type="button" class="danger" hidden>Delete</button>
      <button id="btn-save" type="button" class="primary">Save</button>
    </div>

    <div class="frontmatter-form">
      <label>Title
        <input id="field-title" type="text" placeholder="Post title">
      </label>
      <label id="field-date-wrap">Date
        <input id="field-date" type="date">
      </label>
      <label id="field-tags-wrap">Tags (comma-separated)
        <input id="field-tags" type="text" placeholder="e.g. math, quantum">
      </label>
      <label id="field-excerpt-wrap">Excerpt (optional)
        <input id="field-excerpt" type="text" placeholder="Short description">
      </label>
      <label id="field-draft-wrap" class="checkbox">
        <input id="field-draft" type="checkbox">
        Draft (not published on the site)
      </label>
    </div>

    <div class="split">
      <div class="pane pane-editor">
        <textarea id="markdown-source"></textarea>
      </div>
      <div class="pane pane-preview">
        <div id="preview" class="rendered"></div>
      </div>
    </div>
  </section>

  <script src="/vendor/codemirror/lib/codemirror.js"></script>
  <script src="/vendor/codemirror/mode/markdown/markdown.js"></script>
  <script src="/vendor/marked/marked.umd.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
